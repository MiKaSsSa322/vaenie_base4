name: Forge build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate structure assets
        run: python3 tools/validate_assets.py
      - name: Build Forge mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-military-installations-1.0.0
          path: build/libs/*.jar
